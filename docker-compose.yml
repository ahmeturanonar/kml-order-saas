services:
  db:
    image: postgres:16-alpine
    container_name: kml-order-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kml_order_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kml_order_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kml-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kml-order-saas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kml_order_saas?schema=public}
      ELEVATION_API_URL: ${ELEVATION_API_URL:-http://elevation-engine:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - kml-network

volumes:
  postgres_data:
  uploads_data:

networks:
  kml-network:
    external: true
